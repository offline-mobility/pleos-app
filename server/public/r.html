<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>구조 요청 전달</title>
<style>
  :root { --page: #f7f8fa; --canvas: #fff; --line: #e3e6eb; --ink: #17191e; --body: #474c55; --mute: #8b919c; --urgent: #e5484d; --safe: #2f9a6a; --help: #e8890c; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; color: var(--ink); background: var(--page); }
  main { max-width: 520px; margin: 0 auto; background: var(--canvas); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  p { font-size: 17px; line-height: 1.5; color: var(--body); margin: 8px 0; }
  .where { font-size: 17px; color: var(--ink); font-variant-numeric: tabular-nums; }
  button, a.call { display: block; width: 100%; min-height: 60px; margin-top: 16px; border: 0; border-radius: 14px; font: inherit; font-size: 20px; font-weight: 700; text-align: center; line-height: 60px; text-decoration: none; cursor: pointer; }
  button { background: var(--urgent); color: #fff; }
  button:disabled { opacity: .45; }
  a.call { background: var(--canvas); color: var(--ink); border: 1px solid var(--line); }
  #state { font-weight: 700; min-height: 26px; }
  .ok { color: var(--safe); } .wait { color: var(--help); }
  small { display: block; margin-top: 16px; font-size: 14px; color: var(--mute); line-height: 1.5; }
</style>
</head>
<body>
<main>
  <h1 id="title">구조 요청 전달</h1>
  <p id="lead"></p>
  <p class="where" id="where"></p>
  <p id="state" role="status"></p>
  <button id="send" hidden>구조 서버로 전달하기</button>
  <a class="call" id="call" href="tel:119" hidden>119에 전화하기</a>
  <small id="note" hidden>통신이 끊긴 곳의 차량이 화면에 띄운 구조 요청입니다. 차량이 직접 보낸 내용이며 사실 여부는 확인되지 않았습니다. 이 휴대폰의 이름·전화번호는 전송되지 않습니다.</small>
</main>
<script type="module" src="/r.js"></script>
</body>
</html>
